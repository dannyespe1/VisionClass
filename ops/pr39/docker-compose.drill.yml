services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pr39
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: visionclass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr39 -d visionclass"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "synthetic-only"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "synthetic-only", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    image: vision_system-backend:latest
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 30"]
    environment:
      DEBUG: "True"
      SECRET_KEY: pr39-synthetic-only-not-for-deployment
      DATABASE_URL: postgresql://pr39:synthetic-only@db:5432/visionclass
      REDIS_ENABLED: "True"
      REDIS_URL: redis://:synthetic-only@redis:6379/0
      PRODUCTION_OBSERVABILITY: "True"
    volumes:
      - ../../backend:/app
      - ../../contracts:/contracts:ro
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    image: vision_system-ml:latest
    command: ["python", "ml_service.py"]
    environment:
      BACKEND_URL: http://backend:8000
      ML_SERVICE_IDENTITY: "0"
      REDIS_ENABLED: "0"
    volumes:
      - ../../ml:/app
    ports:
      - "127.0.0.1:19000:9000"
    depends_on:
      - backend

volumes:
  db_data:
