# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

databases:
  - name: visionclass-db
    databaseName: vision_system
    user: vision_user
    postgresMajorVersion: "15"
    ipAllowList: []

services:
  - type: web
    name: visionclass-backend
    runtime: python
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/ready/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: visionclass-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: visionclass-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: visionclass-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: visionclass-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: PRODUCTION_OBSERVABILITY
        value: "True"
      - key: EDGE_SHADOW_REPORTING
        value: "False"
      - key: OBSERVER_ANNOTATION
        value: "False"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false
      - key: SITE_ID
        value: "1"
      - key: CONSENT_V2_ENABLED
        value: "True"
      - key: CONSENT_TEXT_APPROVED
        value: "True"
      - key: CONSENT_CURRENT_VERSION
        value: visionclass-local-v1
      - key: PILOT_RELEASE
        value: "False"
      - key: STUDENT_ATTENTION_DASHBOARD
        value: "False"
      - key: TEACHER_GROUP_DASHBOARD
        value: "False"
      - key: RESEARCH_DASHBOARD
        value: "False"
      - key: CONSERVATIVE_INTERVENTIONS
        value: "False"
      - key: ML_SERVICE_IDENTITY
        value: "True"
      - key: ML_SERVICE_TOKEN
        generateValue: true
      - key: ML_SERVICE_SCOPES
        value: events:write

  - type: pserv
    name: visionclass-ml
    runtime: python
    rootDir: ml
    plan: 1c-2g
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn ml_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: BACKEND_URL
        fromService:
          type: web
          name: visionclass-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEQUENCE_LENGTH
        value: "16"
      - key: MODEL_IMG_SIZE
        value: "224"
      - key: TRAIN_ON_START
        value: "0"
      - key: ML_SERVICE_IDENTITY
        value: "1"
      - key: ML_BACKEND_SERVICE_TOKEN
        fromService:
          type: web
          name: visionclass-backend
          envVarKey: ML_SERVICE_TOKEN
      - key: BFF_SERVICE_TOKEN
        generateValue: true
      - key: BFF_SERVICE_SCOPES
        value: temporal:infer

  - type: web
    name: visionclass-frontend
    runtime: node
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/attention-proxy
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: visionclass-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_REDIRECT_URI
        sync: false
      - key: NEXT_PUBLIC_PILOT_RELEASE
        value: "false"
      - key: NEXT_PUBLIC_STUDENT_ATTENTION_DASHBOARD
        value: "false"
      - key: NEXT_PUBLIC_TEACHER_GROUP_DASHBOARD
        value: "false"
      - key: NEXT_PUBLIC_RESEARCH_DASHBOARD
        value: "false"
      - key: NEXT_PUBLIC_CONSERVATIVE_INTERVENTIONS
        value: "false"
      - key: NEXT_PUBLIC_OBSERVER_ANNOTATION
        value: "false"
      - key: NEXT_PUBLIC_MASKED_GRU_SHADOW
        value: "true"
      - key: NEXT_PUBLIC_EDGE_SHADOW_REPORTING
        value: "false"
