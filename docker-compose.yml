services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 128mb --maxmemory-policy volatile-ttl --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: vision_system
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - default
      - state
  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - ML_BFF_SERVICE_TOKEN=${ML_BFF_SERVICE_TOKEN:-}
    depends_on:
      - backend
  ml:
    build: ./ml
    command: python ml_service.py
    environment:
      - BACKEND_URL=http://backend:8000
      - ML_SERVICE_IDENTITY=1
      - ML_BACKEND_SERVICE_TOKEN=${ML_BACKEND_SERVICE_TOKEN:-}
      - BFF_SERVICE_TOKEN=${ML_BFF_SERVICE_TOKEN:-}
      - BFF_PREVIOUS_SERVICE_TOKEN=${ML_BFF_PREVIOUS_SERVICE_TOKEN:-}
      - BFF_SERVICE_SCOPES=frames:analyze,events:consume,models:read
      - SEQUENCE_LENGTH=16
      - REDIS_ENABLED=${REDIS_ENABLED:-0}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    volumes:
      - ./ml:/app
    ports:
      - "9000:9000"
    depends_on:
      - backend
      - redis
    networks:
      - default
      - state
volumes:
  pg_data:
  redis_data:
networks:
  state:
    internal: true
